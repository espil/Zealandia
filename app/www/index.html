<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Espil Online - Zealandia</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0a1210;
    font-family:"Segoe UI", "Malgun Gothic", system-ui, sans-serif; color:#fff;
    -webkit-user-select:none; user-select:none; }
  #game { position:fixed; inset:0; display:block; }

  /* HUD shell in the live espil.online UI language: dark glass, thin
     light borders, soft radius. Game surfaces never print the hidden
     land's name - the location reads Unknown Land. */
  .glass { background:rgba(10,18,20,.55); border:1px solid rgba(255,255,255,.14);
    border-radius:14px; backdrop-filter:blur(6px); }
  #loc-chip { position:fixed; top:14px; left:14px; padding:8px 14px; font-size:14px;
    letter-spacing:.04em; z-index:5; }
  #loc-chip b { font-weight:600; }
  #loc-chip span { opacity:.65; font-size:12px; margin-left:8px; }
  #title-card { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:6; opacity:0; transition:opacity .8s ease; }
  #title-card.show { opacity:1; }
  #title-card .name { font-size:52px; font-weight:200; letter-spacing:.28em; text-indent:.28em;
    text-shadow:0 2px 24px rgba(0,0,0,.55); }
  #prompt { position:fixed; left:50%; bottom:148px; transform:translateX(-50%);
    padding:9px 18px; font-size:14px; z-index:5; display:none; }
  #prompt .key { display:inline-block; border:1px solid rgba(255,255,255,.45); border-bottom-width:2px;
    border-radius:6px; padding:0 7px; margin-right:9px; font-size:12px; line-height:20px; }
  #toast { position:fixed; left:50%; top:64px; transform:translateX(-50%);
    padding:10px 20px; font-size:14px; z-index:7; display:none; }
  #hud-bottom { position:fixed; left:50%; bottom:12px; transform:translateX(-50%);
    width:min(680px, 92vw); z-index:5; padding:10px 14px 12px; }
  #hud-bottom .row { display:flex; align-items:center; gap:10px; }
  #lvl { width:38px; height:38px; border-radius:50%; border:1px solid rgba(255,255,255,.35);
    display:flex; align-items:center; justify-content:center; font-size:15px; flex:none;
    background:rgba(255,255,255,.06); }
  #exp-wrap { flex:1; }
  #exp-track { height:8px; border-radius:5px; background:rgba(255,255,255,.13); overflow:hidden; }
  #exp-fill { height:100%; width:0%; border-radius:5px;
    background:linear-gradient(90deg,#57c98a,#a8e063); }
  #exp-label { font-size:11px; opacity:.7; margin-top:4px; letter-spacing:.05em; }
  #quickbar { display:flex; gap:6px; margin-left:6px; }
  #quickbar .slot { width:38px; height:38px; border-radius:9px; flex:none;
    border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.05);
    display:flex; align-items:center; justify-content:center; font-size:11px; opacity:.85; }
  #chat { position:fixed; left:14px; bottom:12px; width:300px; max-width:44vw; z-index:5;
    padding:9px 12px; font-size:12.5px; line-height:1.55; }
  #chat .sys { opacity:.75; }
  #chat .input { margin-top:6px; border-top:1px solid rgba(255,255,255,.12); padding-top:6px; opacity:.5; }
  #boot { position:fixed; inset:0; background:#0a1210; z-index:20; display:flex;
    align-items:center; justify-content:center; font-size:15px; letter-spacing:.12em; opacity:1;
    transition:opacity .5s ease; }
  #boot.done { opacity:0; pointer-events:none; }
  #help { position:fixed; right:14px; top:14px; z-index:5; padding:8px 12px; font-size:12px; opacity:.85; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="boot">ENTERING THE GAME</div>

<div id="loc-chip" class="glass"><b>Unknown Land</b><span>Zealandia</span></div>
<div id="help" class="glass">WASD / 방향키 이동 · SHIFT 달리기 · SPACE 상호작용</div>
<div id="title-card"><div class="name">Unknown Land</div></div>
<div id="prompt" class="glass"><span class="key">SPACE</span><span id="prompt-text"></span></div>
<div id="toast" class="glass"></div>

<div id="chat" class="glass">
  <div class="sys">Unknown Land에 도착했습니다.</div>
  <div class="input">메시지를 입력하세요… (채팅은 후속 슬라이스에서 연결됩니다)</div>
</div>

<div id="hud-bottom" class="glass">
  <div class="row">
    <div id="lvl">1</div>
    <div id="exp-wrap">
      <div id="exp-track"><div id="exp-fill"></div></div>
      <div id="exp-label">EXP 0 / 10</div>
    </div>
    <div id="quickbar">
      <div class="slot">Q</div><div class="slot">W</div><div class="slot">E</div>
      <div class="slot">R</div><div class="slot">1</div><div class="slot">2</div>
    </div>
  </div>
</div>

<script src="js/engine.js"></script>
</body>
</html>
