<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espil Online - TEST direct entry</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#04141c; color:#dff7f2; font-family:system-ui, sans-serif; }
  .box { text-align:center; padding:24px; }
  .t { font-size:18px; letter-spacing:.04em; margin-bottom:8px; }
  .s { font-size:13px; opacity:.8; line-height:1.6; }
</style>
</head>
<body>
<div class="box">
  <div class="t">TEST ENTRY</div>
  <div class="s" id="msg">Entering the game directly, no landing page…</div>
</div>
<script>
/* ================================================================
   TEST-ONLY direct entry (Han, 2026-10-24).
   Skips the landing -> city select -> Time Stone route so in-game
   screens (Globe View etc.) can be tested immediately.

   Usage:
     test-direct.html              -> Waitematā village (town spawn,
                                      the well plaza), Globe View on
     test-direct.html?to=auckland  -> Auckland in-game (Time Stone)

   How: seeds a test character/name ONLY if none exist, marks the
   Auckland cinematic as seen, then hands over to index.html
   through the SAME session tokens the real flows use (pending
   city + stone crossing), plus the espil_test_direct flag that
   lets index.html's test hook pass the login gate automatically.
   The normal entry flow is untouched for everyone else.
   ================================================================ */
(function(){
  var to = 'village';
  try { to = (new URLSearchParams(location.search).get('to') || 'village').toLowerCase(); } catch(e){}

  try {
    if (!localStorage.getItem('espil_character'))
      localStorage.setItem('espil_character', JSON.stringify({ gender:'male', ts: Date.now(), test:true }));
    if (!localStorage.getItem('espil_username'))
      localStorage.setItem('espil_username', 'Tester');
    localStorage.setItem('espil_auckland_cine_seen', '1');

    sessionStorage.setItem('espil_test_direct', '1');
    if (to === 'auckland') {
      sessionStorage.setItem('espil_pending_city', 'Auckland');
      document.getElementById('msg').textContent = 'Entering Auckland directly…';
    } else {
      sessionStorage.setItem('espil_pending_city', 'Waitematā');
      sessionStorage.setItem('espil_stone_crossing', '1');
      document.getElementById('msg').textContent = 'Entering the Zealandia village directly…';
    }
  } catch(e){}

  location.replace('index.html');
})();
</script>
</body>
</html>
